<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIGAMI — Catégorie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f8f6f3;
    --grey-light: #e8e5e0;
    --grey-mid: #b0aba3;
    --grey-dark: #3a3835;
    --red: #8b0000;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--white);
    color: var(--black);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    letter-spacing: 0.04em;
    cursor: none;
  }

  /* CURSOR */
  .cursor { position:fixed; width:10px; height:10px; background:var(--black); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); mix-blend-mode:multiply; }
  .cursor-ring { position:fixed; width:36px; height:36px; border:1px solid var(--black); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); opacity:.5; }

  /* HEADER */
  header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(248,246,243,0.97);
    border-bottom:1px solid var(--grey-light);
    padding:0 3rem;
    backdrop-filter:blur(12px);
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:.7rem; text-decoration:none; color:var(--black); }
  .logo-img { height:44px; mix-blend-mode:multiply; }
  .logo-text { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:1.4rem; letter-spacing:.3em; }
  .back-btn {
    display:flex; align-items:center; gap:.5rem;
    text-decoration:none; font-size:.62rem; letter-spacing:.15em;
    text-transform:uppercase; color:var(--grey-mid); transition:color .3s; cursor:none;
  }
  .back-btn:hover { color:var(--black); }

  /* HERO */
  .cat-hero {
    margin-top:64px;
    padding:4rem 3rem 3rem;
    background:var(--black);
    position:relative; overflow:hidden;
  }
  .cat-hero-geo { position:absolute; top:0; right:0; width:35%; opacity:.04; pointer-events:none; }
  .cat-hero-label {
    font-size:.58rem; letter-spacing:.3em; text-transform:uppercase;
    color:var(--grey-dark); margin-bottom:.8rem;
    display:flex; align-items:center; gap:1rem;
  }
  .cat-hero-label::before { content:''; width:2rem; height:1px; background:var(--grey-dark); }
  .cat-hero-title {
    font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:clamp(2.5rem,6vw,6rem); line-height:.95;
    letter-spacing:-.02em; color:var(--white);
  }
  .cat-hero-title em { font-style:italic; color:var(--grey-mid); }
  .cat-hero-sub { margin-top:1.2rem; font-size:.58rem; letter-spacing:.2em; color:var(--grey-dark); text-transform:uppercase; }

  /* SPECIAL BADGE */
  .cat-badge {
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.4rem 1rem; margin-bottom:1.2rem;
    font-size:.55rem; letter-spacing:.2em; text-transform:uppercase;
  }
  .cat-badge.new-badge { background:var(--white); color:var(--black); }
  .cat-badge.sale-badge { background:var(--red); color:var(--white); }
  .cat-badge.excl-badge { background:#1a237e; color:var(--white); }

  /* FILTER BAR */
  .filters-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 3rem; border-bottom:1px solid var(--grey-light);
    position:sticky; top:64px; background:var(--white); z-index:50;
    flex-wrap:wrap; gap:.8rem;
  }
  .filters-left { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .filter-pill {
    padding:.38rem .9rem; border:1px solid var(--grey-light);
    background:none; font-family:'Josefin Sans',sans-serif;
    font-size:.58rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--grey-dark); cursor:none; transition:all .2s;
  }
  .filter-pill:hover, .filter-pill.active { background:var(--black); color:var(--white); border-color:var(--black); }
  .filter-pill.sale-pill.active { background:var(--red); border-color:var(--red); }
  .sort-select {
    border:none; border-bottom:1px solid var(--grey-light); background:none;
    font-family:'Josefin Sans',sans-serif; font-size:.6rem;
    letter-spacing:.12em; text-transform:uppercase; color:var(--grey-dark);
    cursor:none; outline:none; padding:.3rem .5rem; appearance:none;
  }

  /* RESULT COUNT */
  .result-count {
    padding:.6rem 3rem;
    font-size:.58rem; letter-spacing:.15em; text-transform:uppercase; color:var(--grey-mid);
    border-bottom:1px solid var(--grey-light);
  }

  /* PRODUCTS */
  .products-wrap { padding:2.5rem 3rem; }
  .products-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2px;
  }

  .product-card { position:relative; cursor:none; background:#f2efe9; }
  .product-img-wrap {
    position:relative; overflow:hidden; aspect-ratio:3/4;
    background:#e8e5e0;
  }
  .product-real-img {
    width:100%; height:100%; object-fit:cover; display:block;
    position:absolute; inset:0; transition:transform .5s ease;
  }
  .product-card:hover .product-real-img { transform:scale(1.04); }
  .product-placeholder-bg {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .product-img-wrap::after {
    content:''; position:absolute; inset:0;
    background:rgba(0,0,0,0); transition:background .4s; z-index:1;
    pointer-events:none;
  }
  .product-card:hover .product-img-wrap::after { background:rgba(0,0,0,.08); }

  /* SWIPEABLE PHOTO STRIP */
  .product-photo-scroll {
    position:absolute; inset:0; display:flex; overflow-x:auto;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; cursor:grab;
  }
  .product-photo-scroll::-webkit-scrollbar { display:none; }
  .product-photo-scroll:active { cursor:grabbing; }
  .product-photo-item {
    flex:0 0 100%; scroll-snap-align:start; position:relative;
    width:100%; height:100%;
  }
  .product-photo-item .product-real-img,
  .product-photo-item .product-placeholder-bg { position:absolute; inset:0; }
  .product-dots {
    position:absolute; top:0.6rem; left:0; right:0;
    display:flex; justify-content:center; gap:0.3rem; z-index:2;
    pointer-events:none;
  }
  .product-dot {
    width:5px; height:5px; border-radius:50%;
    background:rgba(255,255,255,0.55); transition:background .2s, transform .2s;
  }
  .product-dot.active { background:#fff; transform:scale(1.3); }

  .product-photo-arrow {
    position:absolute; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.75); color:#0a0a0a;
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; line-height:1; cursor:pointer; z-index:3;
    opacity:0; transition:opacity .25s ease, background .2s;
  }
  .product-card:hover .product-photo-arrow { opacity:1; }
  .product-photo-arrow:hover { background:#fff; }
  .product-photo-arrow.prev { left:0.5rem; }
  .product-photo-arrow.next { right:0.5rem; }

  .product-tag {
    position:absolute; top:1rem; left:1rem;
    font-size:.52rem; letter-spacing:.15em; text-transform:uppercase;
    padding:.3rem .7rem; z-index:2;
  }
  .product-tag.new  { background:var(--black); color:var(--white); }
  .product-tag.Sale { background:var(--black); color:var(--white); }
  .product-tag.sale-tag { background:var(--red); color:var(--white); }
  .product-tag.excl { background:#1a237e; color:var(--white); }
  .product-promo {
    position:absolute; top:1rem; right:1rem;
    background:var(--red); color:var(--white);
    font-size:.6rem; letter-spacing:.05em; font-weight:400;
    padding:.35rem .55rem; z-index:2; line-height:1;
    font-family:'Cormorant Garamond',serif;
  }

  .product-quick-add {
    position:absolute; bottom:0; left:0; right:0;
    background:var(--white); color:var(--black);
    border:none; padding:.85rem;
    font-family:'Josefin Sans',sans-serif; font-size:.58rem;
    letter-spacing:.18em; text-transform:uppercase;
    cursor:none; transform:translateY(100%);
    transition:transform .3s ease; z-index:3;
  }
  .product-card:hover .product-quick-add { transform:translateY(0); }
  .product-quick-add:hover { background:var(--grey-light); }

  .product-info { padding:1.1rem 1rem 1.4rem; }
  .product-name {
    font-family:'Cormorant Garamond',serif; font-size:1rem;
    font-weight:300; color:var(--black); margin-bottom:.35rem; display:block;
  }
  .product-brand { font-size:.56rem; letter-spacing:.12em; text-transform:uppercase; color:var(--grey-mid); }
  .product-price { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:300; }
  .product-price .original { font-size:.8rem; text-decoration:line-through; color:var(--grey-mid); margin-right:.4rem; }
  .product-price .sale-price { color:#c0392b; }
  .product-meta { display:flex; justify-content:space-between; align-items:center; }

  /* COLOR SWATCHES */
  .product-swatches { display:flex; gap:.3rem; flex-wrap:wrap; margin-bottom:.4rem; }
  .product-swatch {
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid transparent; cursor:none;
    transition:border-color .2s, transform .2s;
  }
  .product-swatch.active, .product-swatch:hover { border-color:var(--black); transform:scale(1.2); }

  /* TAILLES */
  .product-tailles { display:flex; gap:.2rem; flex-wrap:wrap; margin-top:.45rem; }
  .product-taille {
    font-size:.48rem; letter-spacing:.08em;
    padding:.12rem .38rem; border:1px solid var(--grey-light); color:var(--grey-mid);
  }

  /* EMPTY STATE */
  .empty-state { grid-column:1/-1; text-align:center; padding:6rem 2rem; color:var(--grey-mid); }
  .empty-state h3 { font-family:'Cormorant Garamond',serif; font-size:2.5rem; font-weight:300; font-style:italic; margin-bottom:1rem; }
  .empty-state p { font-size:.7rem; letter-spacing:.1em; }
  .empty-state a { color:var(--black); }

  /* NOTIFICATION */
  .notification {
    position:fixed; bottom:2rem; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--black); color:var(--white);
    padding:1rem 2rem; font-size:.65rem; letter-spacing:.15em;
    text-transform:uppercase; z-index:300;
    transition:transform .4s cubic-bezier(.76,0,.24,1); white-space:nowrap;
  }
  .notification.show { transform:translateX(-50%) translateY(0); }

  /* FOOTER */
  footer { background:var(--black); color:var(--white); padding:3rem; margin-top:4rem; text-align:center; }
  footer p { font-size:.58rem; letter-spacing:.2em; color:var(--grey-dark); }

  /* REVEAL */
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  .reveal { opacity:0; transform:translateY(18px); transition:opacity .55s ease, transform .55s ease; }
  .reveal.visible { opacity:1; transform:translateY(0); }

  /* RESPONSIVE */
  @media(max-width:1024px){ .products-grid { grid-template-columns:repeat(3,1fr); } }
  @media(max-width:768px){
    header { padding:0 1.5rem; }
    .cat-hero { padding:3rem 1.5rem 2.5rem; }
    .products-wrap { padding:1.5rem; }
    .filters-bar { padding:1rem 1.5rem; }
    .result-count { padding:.6rem 1.5rem; }
    .products-grid { grid-template-columns:repeat(2,1fr); }
    body { cursor:auto; }
    .cursor, .cursor-ring { display:none; }
  }
  @media(max-width:480px){ .products-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="notification" id="notification"></div>

<!-- HEADER -->
<header>
  <div class="header-top">
    <a href="index.html" class="logo">
      <img src="574978275_4260126607599725_2794783614384322684_n.jpg" alt="ORIGAMI" class="logo-img">
      <span class="logo-text">ORIGAMI</span>
    </a>
    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      &nbsp;Retour
    </a>
  </div>
</header>

<!-- HERO -->
<div class="cat-hero">
  <svg class="cat-hero-geo" viewBox="0 0 400 500" fill="none">
    <polygon points="200,20 380,460 20,460" stroke="white" stroke-width="1"/>
    <polygon points="200,60 340,440 60,440" stroke="white" stroke-width="0.5"/>
    <polygon points="200,100 300,420 100,420" stroke="white" stroke-width="0.5"/>
    <polygon points="200,140 260,400 140,400" stroke="white" stroke-width="0.5"/>
  </svg>
  <div id="catBadge"></div>
  <div class="cat-hero-label">ORIGAMI — Collection 2026</div>
  <h1 class="cat-hero-title" id="catTitle"><em>Catégorie</em></h1>
  <p class="cat-hero-sub" id="catSub">Chargement…</p>
</div>

<!-- FILTERS -->
<div class="filters-bar">
  <div class="filters-left" id="filterPills">
    <button class="filter-pill active" onclick="setFilter('all',this)">Tout</button>
    <button class="filter-pill" onclick="setFilter('New',this)">Nouveautés</button>
    <button class="filter-pill sale-pill" onclick="setFilter('Sale',this)">Promotions</button>
  </div>
  <select class="sort-select" onchange="setSort(this.value)">
    <option value="default">Trier par</option>
    <option value="price-asc">Prix croissant</option>
    <option value="price-desc">Prix décroissant</option>
    <option value="name">Nom A–Z</option>
    <option value="newest">Nouveautés d'abord</option>
  </select>
</div>
<div class="result-count" id="resultCount">—</div>

<!-- PRODUCTS -->
<div class="products-wrap">
  <div class="products-grid" id="productsGrid"></div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 ORIGAMI. Tous droits réservés.</p>
</footer>

<script>
// ═══════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════
const STORAGE_KEY = 'origami_data';

const FALLBACK_PRODUCTS = [
  { id:1, name:'Folded Linen Dress',   brand:'ORIGAMI', price:3200, tag:'New',  category:'Robes',            subcategory:'Robe',   colors:[{name:'Beige',hex:'#c8c4be',image:null}], tailles:['S','M','L'], photos:[] },
  { id:2, name:'Structured Blazer',   brand:'ORIGAMI', price:4800, originalPrice:6800, tag:'Sale', category:'Vestes & Manteaux', subcategory:'Veste', colors:[{name:'Noir',hex:'#1a1a1a',image:null}], tailles:['S','M','L','XL'], photos:[] },
  { id:3, name:'Wide-Leg Trousers',   brand:'ORIGAMI', price:1950, tag:'New',  category:'Pantalons & Jeans', subcategory:'Pantalon', colors:[{name:'Camel',hex:'#d4d0ca',image:null}], tailles:['36','38','40','42'], photos:[] },
  { id:4, name:'Silk Pleat Blouse',   brand:'ORIGAMI', price:2450, tag:null,   category:'Chemises & Blouses',subcategory:'Blouse', colors:[{name:'Blanc',hex:'#e0ddd8',image:null}], tailles:['XS','S','M'], photos:[] },
  { id:5, name:'Minimal Slip Dress',  brand:'ORIGAMI', price:2800, tag:'New',  category:'Robes',            subcategory:'Robe',   colors:[{name:'Gris',hex:'#cac6c0',image:null}], tailles:['S','M','L'], photos:[] },
  { id:6, name:'Active Seam Leggings',brand:'ORIGAMI', price:1250, tag:null,   category:'Tenues de sport',  subcategory:'Sport',  colors:[{name:'Noir',hex:'#bfbbb5',image:null}], tailles:['S','M','L','XL'], photos:[] },
  { id:7, name:'Origami Midi Skirt',  brand:'ORIGAMI', price:1750, originalPrice:2400, tag:'Sale', category:'Jupes & Shorts', subcategory:'Jupe', colors:[{name:'Crème',hex:'#d0ccc6',image:null}], tailles:['36','38','40'], photos:[] },
  { id:8, name:'Tailored Crop Jacket',brand:'ORIGAMI', price:3950, tag:'New',  category:'Vestes & Manteaux',subcategory:'Veste', colors:[{name:'Kaki',hex:'#dedad4',image:null}], tailles:['S','M','L'], photos:[] },
];

function loadData() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}

let data      = loadData();
let allProds  = data?.products?.length ? data.products : FALLBACK_PRODUCTS;

// ═══════════════════════════════════════════════════════
//  CATEGORY MATCHING
// ═══════════════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const catParam = (params.get('cat') || '').replace(/-/g,' ').trim();

// Normalise accents + lower
function norm(s) {
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[&+]/g,' ').replace(/\s+/g,' ').trim();
}

// Remove trailing 's' for singular/plural matching
function stem(s) { return norm(s).replace(/s$/,''); }

// Special category types (tag-based or universal)
const SPECIAL = {
  nouveautes:            p => p.tag === 'New',
  'nouveaux arrivages':  p => p.tag === 'New',
  'new arrivals':        p => p.tag === 'New',
  promotions:            p => p.tag === 'Sale',
  soldes:                p => p.tag === 'Sale',
  sale:                  p => p.tag === 'Sale',
  promo:                 p => p.tag === 'Sale',
  exclusivites:          p => p.tag === 'Exclusive' || p.tag === 'Bestseller',
  'idees cadeaux':       p => true,
  tendances:             p => p.tag === 'Bestseller' || p.tag === 'New',
  vetements:             p => true,
};

const catNorm   = norm(catParam);
const catStem   = stem(catParam);
const specialFn = SPECIAL[catNorm] || null;

function productMatchesCat(p) {
  // 0. Check manually assigned sections (set by admin page picker)
  if (p.sections?.length) {
    if (p.sections.some(s => norm(s) === catNorm || s === catParam ||
        norm(s).includes(catNorm) || catNorm.includes(norm(s)))) return true;
  }

  // 1. Special tag-based sections
  if (specialFn) return specialFn(p);

  // Direct raw name match first (fastest path)
  const rawCat = (p.category || '').trim();
  const rawSub = (p.subcategory || '').trim();
  if (rawCat === catParam || rawSub === catParam) return true;

  const pCat  = norm(rawCat);
  const pSub  = norm(rawSub);
  const pCatS = stem(rawCat);
  const pSubS = stem(rawSub);
  const cn    = catNorm;
  const cs    = catStem;

  // Exact norm match
  if (pCat === cn || (pSub && pSub === cn)) return true;
  // Stem match
  if (pCatS === cs || (pSubS && pSubS === cs)) return true;
  // Containment (guard against empty strings, which are contained in everything)
  if (pCat && cn && (pCat.includes(cn) || cn.includes(pCat))) return true;
  if (pSub && cn && (pSub.includes(cn) || cn.includes(pSub))) return true;
  if (pCatS && cs && (pCatS.includes(cs) || cs.includes(pCatS))) return true;
  if (pSubS && cs && (pSubS.includes(cs) || cs.includes(pSubS))) return true;

  // Token match: every word of URL cat must appear somewhere in product cat+sub
  const cnTokens = cn.split(' ').filter(t => t.length > 2);
  const pTokens  = (pCat + ' ' + pSub).split(' ').filter(t => t.length > 2);
  if (cnTokens.length > 0 && cnTokens.every(t => pTokens.some(pt => pt.includes(t) || t.includes(pt)))) return true;

  // Any single token match (broad fallback)
  if (cnTokens.some(t => pTokens.some(pt => pt === t))) return true;

  return false;
}

// ═══════════════════════════════════════════════════════
//  HERO
// ═══════════════════════════════════════════════════════
function setupHero() {
  document.title = `ORIGAMI — ${catParam}`;
  const words = catParam.split(' ');
  const titleEl = document.getElementById('catTitle');
  if (words.length === 1) {
    titleEl.innerHTML = `<em>${catParam}</em>`;
  } else {
    titleEl.innerHTML = words.slice(0,-1).join(' ') + '<br><em>' + words.slice(-1) + '</em>';
  }

  const badgeEl = document.getElementById('catBadge');
  const subEl   = document.getElementById('catSub');

  if (catNorm === 'nouveautes' || catNorm === 'nouveaux arrivages') {
    badgeEl.innerHTML = `<div class="cat-badge new-badge">◆ Nouvelles collections</div>`;
    subEl.textContent = 'Les dernières pièces ajoutées à notre catalogue';
  } else if (catNorm === 'promotions' || catNorm === 'soldes' || catNorm === 'sale') {
    badgeEl.innerHTML = `<div class="cat-badge sale-badge">◆ Offres spéciales</div>`;
    subEl.textContent = 'Pièces sélectionnées à prix réduit';
  } else if (catNorm === 'exclusivites') {
    badgeEl.innerHTML = `<div class="cat-badge excl-badge">◆ Collection exclusive</div>`;
    subEl.textContent = 'Pièces disponibles en édition limitée';
  } else {
    subEl.textContent = `Collection complète — ${catParam}`;
  }
}

// ═══════════════════════════════════════════════════════
//  FILTER & SORT STATE
// ═══════════════════════════════════════════════════════
let currentFilter = 'all';
let currentSort   = 'default';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderProducts();
}

function setSort(v) { currentSort = v; renderProducts(); }

function getList() {
  let list = allProds.filter(productMatchesCat);
  if (currentFilter === 'New')  list = list.filter(p => p.tag === 'New');
  if (currentFilter === 'Sale') list = list.filter(p => p.tag === 'Sale');
  if (currentSort === 'price-asc')  list.sort((a,b) => a.price - b.price);
  if (currentSort === 'price-desc') list.sort((a,b) => b.price - a.price);
  if (currentSort === 'name')       list.sort((a,b) => a.name.localeCompare(b.name));
  if (currentSort === 'newest')     list.sort((a,b) => (b.id||0) - (a.id||0));
  return list;
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function renderProducts() {
  // Always re-read from localStorage so admin changes appear immediately
  const fresh = localStorage.getItem('origami_data');
  if (fresh) {
    try { const d = JSON.parse(fresh); if (d.products?.length) allProds = d.products; } catch(_) {}
  }

  const grid = document.getElementById('productsGrid');
  const list = getList();

  document.getElementById('catSub').textContent =
    specialFn
      ? (catNorm.includes('promo')||catNorm==='sale'||catNorm==='soldes' ? 'Pièces sélectionnées à prix réduit' : `Les dernières pièces ajoutées — ${catParam}`)
      : `Collection complète — ${catParam}`;

  document.getElementById('resultCount').textContent =
    `${list.length} article${list.length !== 1 ? 's' : ''} trouvé${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <h3>Aucun article…</h3>
        <p>Aucun produit ne correspond à cette catégorie pour le moment.<br>
        <a href="index.html">← Retour à l'accueil</a></p>
      </div>`;
    return;
  }

  // Map productId → colors (avoids large inline JSON in onclick)
  const _catColorsMap = new Map();

  try {
    grid.innerHTML = list.map((p, i) => {
      const colors = p.colors?.length ? p.colors : [{name:'',hex:p.color||'#c8c4be',image:null}];
      _catColorsMap.set(p.id, colors);

      // Gather every photo this product has (main gallery + any per-color images), de-duplicated
      const allPhotos = [
        ...(p.photos?.length ? p.photos : []),
        ...colors.map(c => c.image).filter(Boolean),
      ].filter((src, idx, arr) => arr.indexOf(src) === idx);
      const firstHex = colors[0]?.hex || '#c8c4be';

      const imgHTML = allPhotos.length
        ? `<div class="product-photo-scroll" onclick="event.stopPropagation()">
             ${allPhotos.map(src => `<div class="product-photo-item"><img class="product-real-img" src="${src}" alt=""></div>`).join('')}
           </div>
           ${allPhotos.length > 1 ? `<div class="product-dots">${allPhotos.map((_,di) => `<span class="product-dot${di===0?' active':''}"></span>`).join('')}</div>
           <button type="button" class="product-photo-arrow prev" onclick="event.stopPropagation();shiftPhoto(this,-1)" aria-label="Photo précédente">‹</button>
           <button type="button" class="product-photo-arrow next" onclick="event.stopPropagation();shiftPhoto(this,1)" aria-label="Photo suivante">›</button>` : ''}`
        : `<div class="product-placeholder-bg" style="background:${firstHex}">
             <svg viewBox="0 0 120 120" width="60" height="60" fill="none" opacity="0.15">
               <polygon points="60,8 112,100 8,100" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
               <polygon points="60,30 90,90 30,90" stroke="#0a0a0a" stroke-width="0.8" fill="none"/>
             </svg>
           </div>`;

      const tagLabel = { New:'Nouveau', Sale:'Promo', Exclusive:'Exclusif', Bestseller:'Best-seller' }[p.tag] || p.tag;
      const tagClass = p.tag === 'Sale' ? 'sale-tag' : p.tag === 'Exclusive' ? 'excl' : 'new';

      const swatchesHTML = colors.length > 1
        ? `<div class="product-swatches">${colors.map((c,ci) =>
             `<span class="product-swatch${ci===0?' active':''}"
                style="background:${c.hex}" title="${(c.name||'').replace(/"/g,'')}"
                onclick="event.stopPropagation();switchColor(${p.id},${ci},this)"></span>`
           ).join('')}</div>` : '';

      const taillesHTML = p.tailles?.length
        ? `<div class="product-tailles">${p.tailles.map(t=>`<span class="product-taille">${t}</span>`).join('')}</div>` : '';

      const prodUrl = `product.html?id=${p.id}&cat=${encodeURIComponent(catParam)}&name=${encodeURIComponent(p.name)}&price=${p.price||0}${p.originalPrice?'&orig='+p.originalPrice:''}${p.tag?'&tag='+encodeURIComponent(p.tag):''}`;

      return `
        <div class="product-card reveal" style="animation-delay:${Math.min(i*0.04,0.4)}s" data-id="${p.id}">
          <div class="product-img-wrap">
            ${imgHTML}
            ${(p.qty??1)===0 ? `<span class="product-tag sale-tag">Épuisé</span>` : p.tag ? `<span class="product-tag ${tagClass}">${tagLabel}</span>` : ''}
            ${p.promo ? `<span class="product-promo">-${p.promo}%</span>` : ''}
            <button class="product-quick-add" onclick="location.href='${prodUrl}'">Voir le produit →</button>
          </div>
          <div class="product-info" style="cursor:pointer" onclick="location.href='${prodUrl}'">
            <span class="product-name">${p.name}</span>
            ${p.code ? `<span style="display:block;font-size:0.48rem;letter-spacing:0.18em;color:var(--grey-mid);margin-bottom:0.3rem">${p.code}</span>` : ''}
            ${swatchesHTML}
            <div class="product-meta">
              <span class="product-brand">${p.brand||'ORIGAMI'}</span>
              <span class="product-price">
                ${p.originalPrice
                  ? `<span class="original">DA ${Number(p.originalPrice).toLocaleString()}</span><span class="sale-price">DA ${Number(p.price).toLocaleString()}</span>`
                  : `DA ${Number(p.price).toLocaleString()}`}
              </span>
            </div>
            ${taillesHTML}
          </div>
        </div>`;
    }).join('');
  } catch(err) {
    grid.innerHTML = `<div class="empty-state"><h3>Erreur</h3><p>${err.message}</p></div>`;
  }

  observeReveal();
  initPhotoSwipe();
}

// ─── Arrow buttons: step to prev/next photo ──────────────────────────────────
function shiftPhoto(btn, dir) {
  const wrap = btn.closest('.product-img-wrap');
  const strip = wrap.querySelector('.product-photo-scroll');
  if (!strip) return;
  const count = strip.querySelectorAll('.product-photo-item').length;
  const current = Math.round(strip.scrollLeft / strip.clientWidth);
  const next = (current + dir + count) % count;
  strip.scrollTo({ left: next * strip.clientWidth, behavior: 'smooth' });
}

// ─── Swipeable photo strip: scroll-synced dots + mouse-drag support ──────────
function initPhotoSwipe() {
  document.querySelectorAll('.product-photo-scroll').forEach(strip => {
    if (strip._swipeInit) return;
    strip._swipeInit = true;

    const dotsWrap = strip.parentElement.querySelector('.product-dots');

    const syncDots = () => {
      if (!dotsWrap) return;
      const idx = Math.round(strip.scrollLeft / strip.clientWidth);
      dotsWrap.querySelectorAll('.product-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    };
    strip.addEventListener('scroll', () => requestAnimationFrame(syncDots), { passive: true });

    if (dotsWrap) {
      dotsWrap.querySelectorAll('.product-dot').forEach((dot, i) => {
        dot.style.pointerEvents = 'auto';
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', e => {
          e.stopPropagation();
          strip.scrollTo({ left: i * strip.clientWidth, behavior: 'smooth' });
        });
      });
    }

    // Mouse-drag-to-swipe for desktop (touch scrolling works natively already)
    let isDown = false, startX = 0, startScroll = 0, moved = false;
    strip.addEventListener('mousedown', e => {
      isDown = true; moved = false;
      startX = e.pageX; startScroll = strip.scrollLeft;
    });
    window.addEventListener('mousemove', e => {
      if (!isDown) return;
      const dx = e.pageX - startX;
      if (Math.abs(dx) > 4) moved = true;
      strip.scrollLeft = startScroll - dx;
    });
    window.addEventListener('mouseup', () => { isDown = false; });
    strip.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); } });
  });
}

function switchColor(productId, idx, dot) {
  const colors = _catColorsMap.get(productId);
  if (!colors) return;
  const card = dot.closest('.product-card');
  card.querySelectorAll('.product-swatch').forEach((s,i) => s.classList.toggle('active', i===idx));
  const wrap = card.querySelector('.product-img-wrap');
  const c = colors[idx];
  let img = wrap.querySelector('.product-real-img');
  if (c.image) {
    if (!img) { img = document.createElement('img'); img.className='product-real-img'; wrap.insertBefore(img, wrap.firstChild); }
    img.src = c.image;
  } else {
    if (img) img.remove();
    const bg = wrap.querySelector('.product-placeholder-bg');
    if (bg) bg.style.background = c.hex;
  }
}

// ═══════════════════════════════════════════════════════
//  LIVE SYNC ENGINE
// ═══════════════════════════════════════════════════════
let _lastSync = '';

function syncNow() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw || raw === _lastSync) return;
    _lastSync = raw;
    const d = JSON.parse(raw);
    if (d.products) { allProds = d.products; }
    renderProducts();
    showSyncBadge();
  } catch(_) {}
}

function showSyncBadge() {
  let b = document.getElementById('syncBadge');
  if (!b) {
    b = document.createElement('div');
    b.id = 'syncBadge';
    b.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;background:#0a0a0a;color:#f8f6f3;padding:.5rem 1rem;font-family:"Josefin Sans",sans-serif;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;z-index:9000;opacity:0;transition:opacity .4s;pointer-events:none;';
    document.body.appendChild(b);
  }
  b.textContent = '● Catalogue mis à jour';
  b.style.opacity = '1';
  clearTimeout(b._t);
  b._t = setTimeout(() => b.style.opacity = '0', 2500);
}

// localStorage event (fires in other tabs)
window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY) syncNow();
});

// BroadcastChannel (instant same-browser push from admin)
try {
  const bc = new BroadcastChannel('origami_sync');
  bc.onmessage = (e) => { if (e.data?.type === 'origami_update') syncNow(); };
} catch(e) {}

// Re-sync when user comes back to this tab
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncNow();
});
window.addEventListener('focus', syncNow);

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function esc(s) { return (s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }

function addNotif(name) {
  const el = document.getElementById('notification');
  el.textContent = `${name} — ajouté au panier`;
  el.classList.add('show');
  clearTimeout(window._nt);
  window._nt = setTimeout(() => el.classList.remove('show'), 2800);
}

function observeReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.05 });
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => obs.observe(el));
}

// Cursor
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cursor.style.left=mx+'px'; cursor.style.top=my+'px'; });
(function animRing(){ rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(animRing); })();

// Pull the shared catalogue from the server (works across every visitor/device)
async function syncFromAPI() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) return;
    const fresh = await res.json();
    if (fresh && fresh.products) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch(e) {}
      renderProducts();
    }
  } catch(e) { /* offline or API unavailable — keep local cache */ }
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
setupHero();
renderProducts();
syncFromAPI();
</script>
